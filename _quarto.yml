# Main configuration for this Quarto website.
# Edit pages in the .qmd files. Edit appearance in style.css.

project:
  type: website
  output-dir: docs

  # Only render the actual website pages
  render:
    - index.qmd
    - research.qmd
    - publications.qmd
    - beyond-research.qmd
    - contact.qmd

  resources:
    - .nojekyll

website:
  title: "Pablo Peña-Aguilera"
  description: "Ecology, biogeography and biodiversity research — Pablo Peña-Aguilera"

  # IMPORTANT: verify this against the actual GitHub repository before publishing.
  # For a user site (repo pablodlpa.github.io), the URL below is correct.
  # For a project site (repo OTHER_NAME), use:
  #   https://pablodlpa.github.io/OTHER_NAME/
  site-url: "https://pablodlpa.github.io/"

  navbar:
    title: ""
    background: "#17372f"  # Match --forest in style.css
    foreground: "#f9f7f1"
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research & Projects
      - href: publications.qmd
        text: Publications
      - href: beyond-research.qmd
        text: Scientific outreach
      - href: contact.qmd
        text: Contact

  page-footer:
    left: "© 2026 Pablo Peña-Aguilera"
    right: "Built with [Quarto](https://quarto.org/) · [ORCID](https://orcid.org/0000-0002-8999-1140)"

format:
  html:
    theme: cosmo
    css: style.css         # Single, organised stylesheet
    toc: false
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: false

# Safe to keep for future pages with executable R code.
execute:
  freeze: auto
